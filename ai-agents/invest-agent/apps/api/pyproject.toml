[project]
name = "financial-ai-agent-api"
version = "0.1.0"
description = "자연어 투자 에이전트 서버 (FastAPI + PostgreSQL)."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.0",
  "psycopg[binary]>=3.3.6",
  "langgraph>=1.2.12",
  "langgraph-checkpoint-postgres>=3.1.2",
  "langchain-google-genai>=4.4.0",
  "google-auth>=2.40",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 실제 Gemini를 부르는 테스트는 비용이 들어서 기본으로 건너뛴다. 실행: uv run pytest -m gemini
addopts = "-m 'not gemini'"
markers = ["gemini: 실제 Gemini API를 부르는 테스트 (비용 발생)"]
