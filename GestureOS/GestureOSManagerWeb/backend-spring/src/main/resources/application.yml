spring:
  config:
    import: "optional:classpath:application-api.yml"

  # 웹 서비스라 DB 는 필수다. spring.sql.init 이 기동 시 schema.sql/data.sql 을 실행하므로
  # PostgreSQL 이 없으면 기동되지 않는다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slt}
    username: ${DB_USER:sltuser}
    password: ${DB_PASSWORD:sltpass}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  # ✅ 여기 추가: 업로드 제한(3MB)
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

  # 메일 계정이 없으면 기동은 되고, 메일을 쓰는 기능(인증코드/아이디찾기/비밀번호재설정)만
  # 503 으로 거절된다. 예전에는 기본값이 없어서 환경변수를 잊으면 앱이 아예 뜨지 않았다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  # client-id 가 빈 문자열이면 Spring 이 기동을 거부한다
  # (Client id of registration 'google' must not be empty).
  # 그래서 미설정 기본값은 빈 값이 아니라 not-configured 다. 설정하지 않은 제공자는
  # 버튼을 눌렀을 때 실패하고, 어떤 제공자가 미설정인지는 기동 로그에 나온다.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:not-configured}
            scope: [ email, profile ]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          kakao:
            client-id: ${OAUTH_KAKAO_CLIENT_ID:not-configured}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:not-configured}
            scope: [ account_email, profile_nickname ]
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            client-authentication-method: client_secret_post

          naver:
            client-id: ${OAUTH_NAVER_CLIENT_ID:not-configured}
            client-secret: ${OAUTH_NAVER_CLIENT_SECRET:not-configured}
            scope: [ name, email ]
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  address: 0.0.0.0
  port: 8082

mybatis:
  configuration:
    map-underscore-to-camel-case: true

kcisa:
  base-url: ${KCISA_BASE_URL:https://api.kcisa.kr/openapi/service/rest/meta13/getCTE01701}
  # 인증키는 소스에 두지 않는다. 값이 없으면 KCISA 연동만 비활성된다.
  service-key: ${KCISA_SERVICE_KEY:}
  num-of-rows: ${KCISA_NUM_OF_ROWS:10}

jwt:
  # 반드시 환경변수 JWT_SECRET 으로 준다. 기본값을 두면 그 값이 리포에 공개된 서명키가 되고,
  # 누구나 임의 회원/권한의 토큰을 만들 수 있다. 값이 없으면 기동 시 실패한다.
  # 생성 예: openssl rand -base64 48
  secret: ${JWT_SECRET:}
  access-token:
    exp-minutes: ${ACCESS_TOKEN_EXP_MINUTES:60}
  refresh-token:
    exp-days: ${REFRESH_TOKEN_EXP_DAYS:7}

app:
  frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:5174/oauth2/success}
  admin:
    # 시드 admin 계정의 초기 비밀번호. 비어 있으면 admin 은 로그인 불가 상태로 남는다.
    # 이미 비밀번호가 설정된 뒤에는 이 값을 바꿔도 덮어쓰지 않는다.
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  # 값이 없으면 AI 도움말(/api/help)만 비활성된다.
  openai:
    api-key: ${OPENAI_API_KEY:}
  help:
    # D 드라이브 하드코딩이었다. 프로젝트 폴더 기준 상대 경로가 기본값.
    vector-cache-path: ${HELP_VECTOR_CACHE_PATH:./data/help-vectors.json}
