<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 사주 보기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      display: flex;
      flex-direction: column;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    input, select {
      margin-top: 8px;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      margin-top: 20px;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 6px;
      border-left: 4px solid #667eea;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      min-height: 50px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔮 AI 사주 보기</h1>

    <form id="saju-form">
      <label>
        이름
        <input type="text" name="name" placeholder="예: 홍길동" required>
      </label>

      <label>
        생년월일
        <input type="date" name="birthDate" required>
      </label>

      <label>
        태어난 시간 (선택)
        <input type="time" name="birthTime">
      </label>

      <label>
        성별
        <select name="gender">
          <option value="male">남성</option>
          <option value="female">여성</option>
        </select>
      </label>

      <button type="submit">사주 보기</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById("saju-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));

      result.textContent = "✨ 사주를 보는 중...";
      result.style.display = "block";

      try {
        const res = await fetch("/api/saju", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const json = await res.json();
        result.textContent = json.result;
      } catch (err) {
        result.textContent = "⚠️ 오류가 발생했습니다: " + err.message;
      }
    });
  </script>
</body>
</html>
